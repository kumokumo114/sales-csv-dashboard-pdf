[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-csv-dashboard-pdf"
version = "1.0.0"
description = "Turn a sales CSV into a clean dashboard and a downloadable PDF report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sales CSV Dashboard contributors"}]
dependencies = ["Flask==3.1.2", "reportlab==4.4.10", "waitress==3.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pypdf==6.6.0", "ruff==0.14.6"]

[project.scripts]
sales-dashboard = "sales_dashboard.__main__:main"

[tool.setuptools.packages.find]
include = ["sales_dashboard*"]

[tool.setuptools.package-data]
sales_dashboard = ["templates/*.html", "static/*", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
